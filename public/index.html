<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <title>Medboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <div class="brand"><span class="logo">✦</span> Medboard</div>
        <button id="newFolder" class="new-btn">+ New folder</button>
      </div>
      <div class="side-label">Your library</div>
      <nav id="tree" class="tree"></nav>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="chat">
      <header class="topbar">
        <button class="icon-btn" id="menu" aria-label="Open library">☰</button>
        <div class="title-wrap">
          <h1 id="title">Medboard</h1>
          <p id="subtitle">Upload a lecture to start studying</p>
        </div>
        <div class="modes" id="modes" hidden>
          <button data-mode="learn" class="on">Learn</button>
          <button data-mode="recall">Recall</button>
          <button data-mode="practice">Practice</button>
        </div>
      </header>

      <section id="thread" class="thread"></section>

      <form id="composer" class="composer" onsubmit="return false">
        <input type="file" id="fileInput" accept=".pdf,.pptx,.docx,.txt,.md" hidden>
        <div class="pill">
          <button type="button" class="plus" id="plus" aria-label="Upload a file">+</button>
          <span class="pill-text">Upload a lecture</span>
          <select id="folderSelect" class="folder-pick" aria-label="Save to folder"></select>
        </div>
        <p class="hint">PDF · PPTX · DOCX · TXT · up to 20 MB</p>
      </form>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
